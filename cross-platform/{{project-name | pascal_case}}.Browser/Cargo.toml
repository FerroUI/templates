[package]
name = "{{project-name}}-browser"
description = "The browser host of {{project-name}}: the application as a WebAssembly module on a canvas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# A binary: the Emscripten target links the wasm-bindgen exports only into executables. The host
# page (wwwroot/) creates the module and calls `runMain`; FerroUI/scripts/build-browser.sh with
# FERROUI_BROWSER_WORKSPACE builds the site (FerroUI/docs/apps.md).
[[bin]]
name = "{{project-name}}-browser"
path = "program.rs"

[target.'cfg(target_os = "emscripten")'.dependencies]
{{project-name}} = { path = "../{{project-name | pascal_case}}" }
ferroui-base = { workspace = true }
ferroui-controls = { workspace = true }
ferroui-browser = { workspace = true }
ferroui-fonts-inter = { workspace = true }
{%- if theme == "material" %}
ferroui-themes-material = { workspace = true }
{%- endif %}
wasm-bindgen = { workspace = true }
