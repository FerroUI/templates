[package]
name = "{{project-name}}"
description = "{{project-name}}: the application, shared by its hosts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# The compiled markup of the crate calls the typed functions of the members it names.
ferroui-base = { workspace = true, features = ["markup-functions"] }
ferroui-controls = { workspace = true }
ferroui-markup = { workspace = true }
ferroui-markup-xaml = { workspace = true }
{{theme_crate}} = { workspace = true }

[build-dependencies]
# The XAML compiler of the build script (build.rs).
ferroui-build = { workspace = true }

[dev-dependencies]
ferroui-base = { workspace = true, features = ["testing"] }
ferroui-controls = { workspace = true, features = ["testing"] }
