[template]
description = "A FerroUI desktop application in XAML with the MVVM pattern: App.xaml, MainWindow.xaml and a view model"
# Copied as they are: the build script has no placeholders.
exclude = ["build.rs"]
ignore = ["theme.rhai"]

[hooks]
pre = ["theme.rhai"]

[placeholders.theme]
type = "string"
prompt = "Theme (winui: WinUI 3, fluent: Fluent, simple: Simple, macos: macOS 26, material: Material 3 Expressive)"
choices = ["winui", "fluent", "simple", "macos", "material"]
default = "winui"

[placeholders.mvvm]
type = "string"
prompt = "MVVM library (minimal: a view model base of the template, reactiveui: ReactiveUI)"
choices = ["minimal", "reactiveui"]
default = "minimal"

[conditional.'mvvm == "reactiveui"']
ignore = ["src/view_models/view_model_base.rs"]
