[template]
description = "Item: a templated control, its class with a styled property and its control theme in XAML"

[placeholders.namespace]
type = "string"
prompt = "The XAML namespace of the module the control goes into (the dotted name NAMESPACES of register_types.rs gives it, for example MyApp.Views)"
regex = "^[A-Za-z_][A-Za-z0-9_]*(\\.[A-Za-z_][A-Za-z0-9_]*)*$"
default = "MyApp.Views"
